# 학생용 CI: push할 때마다 Windows에서 빌드하고, 규칙 테스트와 레이어 검사를 돌리고,
# 각 단계의 실제 화면을 PNG로 찍어 Actions 아티팩트(my-screens)로 올린다.
#
# 처음 받은 starter에서는 테스트와 캡처가 실패하는 것이 정상이다. 과제를 채우면 초록색이 된다.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 구성 (CMake)
        run: cmake -S . -B build -A x64

      - name: 빌드
        run: cmake --build build --config Debug --parallel

      - name: 레이어 검사 (Game → Engine → Render)
        run: python tools/check_layers.py steps

      - name: 규칙 테스트 (00 소코반 시나리오)
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: 화면 캡처 (WARP)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: ./tools/capture_steps.ps1 -BuildDir build -OutDir screens

      - name: 캡처 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: my-screens
          path: screens/
          if-no-files-found: ignore
