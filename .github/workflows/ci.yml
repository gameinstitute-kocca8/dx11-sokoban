# 학생용 CI
#
#  rules   : push할 때마다 (Linux, 1분 안팎)  00·13 규칙 테스트 + 레이어 검사
#  windows : 제출 태그(stepNN-submit)를 push하거나 Actions 탭에서 직접 실행할 때만 (Windows, 수 분)
#            전체 빌드 + 각 단계 화면을 PNG로 찍어 아티팩트 my-screens로 올림
#
# 두 작업 모두 끝에 '자기 점검 보고서'(tools/self_check.py)를 실행 페이지의 Summary에 표로 보여 준다.
# rules는 테스트와 기록, windows는 여기에 화면 비교까지 더한다.
#
# Windows 빌드를 매 push마다 돌리지 않는 이유: private 레포의 Actions 사용량은 조직 전체가 함께 쓰는
# 월 한도에서 차감되고, Windows는 Linux보다 비싸다. 평소에는 내 PC에서 빌드하고, 제출할 때 CI로 확인한다.
#
# 처음 받은 starter에서는 규칙 테스트가 실패하는 것이 정상이다. 00과 13을 채우면 초록색이 된다.
# 00을 하지 않고 13만 한 경우에는 빨간색으로 남는다. 단계별 결과는 Summary의 자기 점검 보고서에서 본다.
name: ci

on:
  push:
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 자기 점검의 'SPEC 먼저' 확인에 git 기록 전체가 필요하다

      - name: 레이어 검사 (Game → Engine → Render)
        run: python3 tools/check_layers.py steps

      - name: 00 빌드
        run: |
          cmake -S . -B build
          cmake --build build --parallel

      - name: 규칙 테스트 (00 소코반, 13 A* 시나리오)
        run: ctest --test-dir build --output-on-failure

      - name: 자기 점검 보고서 (Summary 탭)
        if: always()
        run: python3 tools/self_check.py --build build --summary "$GITHUB_STEP_SUMMARY"

  windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/step')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 구성 (CMake)
        run: cmake -S . -B build -A x64

      - name: 빌드
        run: cmake --build build --config Debug --parallel

      - name: 화면 캡처 (WARP)
        continue-on-error: true
        shell: pwsh
        run: ./tools/capture_steps.ps1 -BuildDir build -OutDir screens

      - name: 자기 점검 보고서 (Summary 탭, 화면 비교 포함)
        if: always()
        shell: pwsh
        run: python tools/self_check.py --build build --config Debug --screens screens --summary $env:GITHUB_STEP_SUMMARY

      - name: 캡처 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: my-screens
          path: screens/
          if-no-files-found: ignore
